name: Deploy to Vercel

# Pushes to main deploy to production automatically. Pull requests get a
# preview deployment so a reviewer can open the change without a local build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy, but never cancel a production
  # deploy midway: a half-applied deployment is worse than a stale one.
  group: vercel-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    name: Verify the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # npm ci, not npm install, so the lockfile is authoritative and a
        # dependency that cannot resolve fails here rather than in production.
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the Vercel routing config
        # Catches a rewrite rule that would 404 deep links, or a service worker
        # header that would stop updates reaching the browser.
        run: node tools/vercel-rewrite-check.mjs

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    # Pull requests get a preview and therefore need the token too, but they do
    # not promote to production.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        # Pinned so a CLI release cannot change deploy behaviour underneath us.
        run: npm install --global vercel@62.7.0

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

      - name: Build
        run: vercel build --prod=${{ github.ref == 'refs/heads/main' }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod=${{ github.ref == 'refs/heads/main' }}